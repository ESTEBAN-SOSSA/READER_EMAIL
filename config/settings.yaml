# =====================================================
# Reglas para identificar solicitudes de cotizacion / licitacion
# =====================================================

# MODO ESTRICTO: la keyword DEBE aparecer en el ASUNTO del correo.
# Esto evita capturar correos que solo mencionan "cotizacion" de paso
# en el cuerpo (firmas, plantillas, hilos antiguos).
keyword_in_subject_only: true

# Palabras clave que identifican una solicitud de cotizacion, licitacion
# o solicitud relacionada con compras.
keywords:
  # --- Cotizacion ---
  - cotizacion
  - cotización
  - cotizar
  - cotice
  - cotiza
  - quotation
  - quote
  - rfq
  - request for quote
  - request for quotation

  # --- Licitacion ---
  - licitacion
  - licitación
  - licitar
  - tender
  - bid
  - bidding
  - rfp
  - request for proposal
  - invitation to bid
  - sourcing event

  # --- Solicitud de oferta / precio / compra ---
  - solicitud de oferta
  - solicitud de precio
  - solicitud de cotizacion
  - solicitud de cotización
  - solicitud cotizacion
  - solicitud cotización
  - solicitud de compra
  - solicitud compra
  - requerimiento de compra
  - requisicion
  - requisición

  # --- Genericas ---
  - presupuesto
  - oferta
  - propuesta comercial

# Excluir correos de estos dominios/strings.
# NO incluimos edemco.co porque los colaboradores INTERNOS reenvian
# cotizaciones de clientes al buzon para que se trabajen.
exclude_sender_domains:
  - mailchimp.com
  - sendgrid.net
  - noreply
  - no-reply
  - notifications
  - mailer-daemon
  - postmaster
  # Notificaciones automaticas internas (no son cotizaciones)
  - matic@edemco.co

# Prefijos del asunto que descartamos.
# Vacio = aceptamos RE: y RV: tambien, porque pueden ser reenvios
# legitimos de cotizaciones.
exclude_subject_prefixes: []

# Prefijos que MARCAN un asunto como reenvio/respuesta legitima.
# Si un correo es del dominio interno PERO su asunto empieza con uno de estos,
# se considera un reenvio/respuesta de una cotizacion externa y se mantiene.
# Si el correo es interno y su asunto NO tiene ninguno de estos prefijos,
# y ademas el hilo es puramente interno, se descarta como "hilo_interno_puro".
internal_forward_subject_prefixes:
  - "RE:"
  - "Re:"
  - "Res:"
  - "RV:"
  - "Rv:"
  - "FW:"
  - "Fw:"
  - "FWD:"
  - "Fwd:"
  - "PSI:"
  - "FYI:"
  - "FYI."
  - "Reply:"

# Strings que si aparecen en CUALQUIER parte del asunto descartan el correo.
# Estos son OC ya aprobadas, facturas, despachos: NO son cotizaciones pendientes.
exclude_subject_contains:
  # --- Ordenes de compra ya aprobadas ---
  - "OCC"
  - "OCS"
  - "O.C:"
  - "O.C "
  - "OC "
  - "Orden de Compra"
  - "Orden de compra"
  - "orden de compra"
  - "purchase order"

  # --- Facturas y pagos ---
  - "facturar"
  - "facturacion"
  - "facturación"
  - "documento factura"
  - "factura electronica"
  - "factura electrónica"
  - "pago de factura"
  - "nota credito"
  - "nota crédito"
  - "nota debito"
  - "nota débito"

  # --- Logistica/operaciones ya cerradas ---
  - "remision"
  - "remisión"
  - "entrada para facturar"
  - "despacho"
  - "entrega de mercancia"
  - "entrega de mercancía"
  - "confirmacion de pedido"
  - "confirmación de pedido"

# Strings que si aparecen en el CUERPO del correo lo descartan.
# Util para reuniones de Microsoft Teams, invitaciones de calendario y
# correos cuyo asunto es legitimo pero el cuerpo revela que NO es cotizacion.
exclude_body_contains:
  - "Reunión de Microsoft Teams"
  - "Microsoft Teams Meeting"
  - "Join Microsoft Teams Meeting"
  - "Únase a Microsoft Teams"
  - "teams.microsoft.com/meet"
  - "teams.microsoft.com/l/meetup-join"
  - "Id. de reunión:"
  - "Meeting ID:"

# Tipos de adjunto que procesamos
attachment_extensions:
  - .pdf
  - .xlsx
  - .xls
  - .csv
  - .docx
  - .doc

# =====================================================
# Agrupacion de cotizaciones relacionadas (escenario 2)
# =====================================================
# Cuando un cliente envia VARIOS correos de una misma cotizacion consolidada
# (uno por item), suelen compartir un mismo numero de documento en el asunto/cuerpo
# (p. ej. "OPM-20260527"). Este regex extrae ese codigo; los correos del mismo
# cliente con el mismo codigo se agrupan como UNA sola solicitud.
# Vacio ("") = agrupacion desactivada.
group_reference_regex: '[A-Z]{2,6}-\d{6,8}'
